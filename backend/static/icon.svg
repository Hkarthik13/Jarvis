<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#070B14"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00F0FF" stroke-width="8" stroke-dasharray="20,15" stroke-opacity="0.8" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#3B82F6" stroke-width="6" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="90" fill="url(#arcGlow)" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="45" fill="#FFFFFF"/>
</svg>
